<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Decorom - Best designer nameplates in Ahmedabad, Gujarat. Custom handcrafted nameplates for homes and offices. Premium quality and modern designs." />
    <meta name="keywords" content="Designer Nameplates Ahmedabad, Custom Nameplates Gujarat, Home Decor, LED Nameplates, Ahmedabad Nameplate Factory" />
    <meta name="author" content="Decorom" />
    <!-- Poppins is now self-hosted via @fontsource/poppins (no external CDN request) -->
    <title>Decorom | Premium Designer Nameplates in Ahmedabad</title>

    <!-- Preconnect to origins used for the LCP hero image and product photos -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Devanagari/Gujarati fonts for the nameplate editor's custom text preview,
         loaded non-blocking (print-media swap trick) so it never delays render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
  </body>
  <script type="module" src="./src/main.jsx"></script>
</html>
